name: flowspend
description: "FlowSpend — Local-only personal finance & expense tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # UI
  fl_chart: ^0.68.0
  flutter_slidable: ^3.1.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3

  # Notifications
  flutter_local_notifications: ^17.0.0

  # SMS
  telephony: ^0.2.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.0
  path_provider: ^2.1.0
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  permission_handler: ^11.3.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  isar_generator: ^3.1.0+1
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
